test_methods:
- id: TM-001
  title: Cryptographic binding and serialization tests
  level: simulation
  procedure: Use valid and tampered fixtures, wrong keys, changed ciphertext and metadata,
    canonicalization ambiguity, wrong contexts, partial disclosure, and self-reference
    cases. Assert address/signature correctness or explicit rejection; do not infer
    physical truth.
- id: TM-002
  title: Traceability and discovery scenario tests
  level: simulation
  procedure: Exercise complete, incomplete, failed, inaccessible, reused, and mismatched
    evidence, per-claim scope/rigor, contradictory reports, revision versus conceptual
    ancestry, and remote partial results. Check exact status and trace outputs.
- id: TM-003
  title: Adversarial authorization and resource tests
  level: simulation
  procedure: Test scope-separated keys, unauthorized actors, prompt/HTML inputs, malicious
    archives/build expressions, replay, host policy changes, logs, quotas, fetch targets,
    and redirects. Assert no unintended execution, disclosure, administration, or
    outbound secret forwarding.
- id: TM-004
  title: Payment workflow state-machine tests
  level: simulation
  procedure: Use a fake host adapter to inject forged, duplicate, concurrent, stale,
    mismatched, out-of-order and cleared callbacks plus explicit upgrade approvals.
    Restart between transitions and check payment status, grant, and key-release invariants.
- id: TM-005
  title: Storage recovery fault-injection tests
  level: simulation
  procedure: Interrupt writes and state transitions, corrupt stored bytes, exhaust
    capacity, and restore backups. Assert atomic publication, rejected corruption,
    preserved cleared requests and grants, and protected secrets.
