# Initial requirements draft. IDs remain stable as wording evolves.
# Verification evidence will be added as the system is implemented.
user_needs:
  - id: UN-001
    title: Find and reuse concrete designs with traceable verification
  - id: UN-002
    title: Retrieve reusable designs across distributed caches
  - id: UN-003
    title: Discover designs by meaning despite differences in terminology

requirements:
  - id: REQ-001
    title: The system shall implement a database mapping REQUIREMENT SPECIFICATIONs to IMPLEMENTATIONs.
    satisfies: [UN-001]

  - id: REQ-002
    title: An IMPLEMENTATION shall contain a concrete design (source code, PCB layouts, etc.), together with a VERIFICATION REPORT.
    satisfies: [UN-001]

  - id: REQ-003
    title: A VERIFICATION REPORT shall show traceability of the concrete design to the REQUIREMENT SPECIFICATION and explicitly identify remaining verification work, including missing evidence and failed verification.
    satisfies: [UN-001]

  - id: REQ-004
    title: Every entry in the database shall have a CONTENT ADDRESS (SHA-256).
    satisfies: [UN-001, UN-002]

  - id: REQ-005
    title: An IMPLEMENTATION may reference other IMPLEMENTATIONs by their CONTENT ADDRESSes; the system shall expand these references, where necessary, into build system relationships (such as Bazel MODULE dependencies).
    satisfies: [UN-001]

  - id: REQ-006
    title: The system shall support distributed deployment; an instance of the system is known as a CACHE.
    satisfies: [UN-002]

  - id: REQ-007
    title: A CACHE may be referred to by its internet address together with a port number.
    satisfies: [UN-002]

  - id: REQ-008
    title: If a CONTENT ADDRESS is not available in the local CACHE, the system shall support retrieving the corresponding entry from another CACHE (as with Nix substituters).
    satisfies: [UN-002]

  - id: REQ-009
    title: The system shall support fuzzy search of REQUIREMENT SPECIFICATIONs via a SEMANTIC DECOMPOSITION, including discovering systems that implement a method for moving water when described as pump, aqueduct, bucket, or equivalent terms.
    satisfies: [UN-003]

  - id: REQ-010
    title: The database shall permit storage of IMPLEMENTATIONs with incomplete verification evidence.
    satisfies: [UN-001]

  - id: REQ-011
    title: The system shall expose a machine-readable verification status for each IMPLEMENTATION and shall classify it as fully verified only when passing evidence covers every requirement in its REQUIREMENT SPECIFICATION for that concrete design and meets any evidence or rigor demands explicitly specified; missing, failed, or stale evidence shall prevent that classification.
    satisfies: [UN-001]

  - id: REQ-012
    title: Selection, retrieval for reuse, and dependency resolution shall require fully verified IMPLEMENTATIONs by default; using any other IMPLEMENTATION shall require an explicit opt-in and shall preserve its verification status in the returned artifact, including when retrieved from another CACHE.
    satisfies: [UN-001, UN-002]

  - id: REQ-013
    title: The system shall classify an IMPLEMENTATION as fully verified only when every IMPLEMENTATION it depends on, directly or transitively, is also fully verified; a dependency with missing, incomplete, failed, stale, or unknown verification shall prevent that classification. Version-history references shall not constitute implementation dependencies.
    satisfies: [UN-001, UN-002]

  - id: REQ-014
    title: The system shall compute a REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT's CONTENT ADDRESS as the SHA-256 of a deterministic manifest covering all of its data, including its REQUIREMENT SPECIFICATION, concrete design files, VERIFICATION REPORT and evidence, SEMANTIC DECOMPOSITION, implementation dependencies, version-history predecessors, and display-only predecessor explanations, with referenced artifacts identified by CONTENT ADDRESS.
    satisfies: [UN-001, UN-002]

  - id: REQ-015
    title: Database objects shall be immutable; changes to evidence, features, requirements, or composition shall produce a distinct object with a new CONTENT ADDRESS without modifying the previous object.
    satisfies: [UN-001, UN-002]

  - id: REQ-016
    title: Each derived version of a database object shall record the CONTENT ADDRESSes of one or more predecessor objects that contributed conceptually to its production, and shall include all of those addresses in the content used to compute its own CONTENT ADDRESS, forming an explicit traversable provenance graph; an initial object with no predecessors shall record an empty predecessor set.
    satisfies: [UN-001, UN-002]

  - id: REQ-017
    title: Each predecessor link shall include a human-readable explanation of its conceptual contribution; the system shall expose that explanation as display-only, non-authoritative metadata, and shall not use it to establish verification status, dependency relationships, or lineage conclusions.
    satisfies: [UN-001]

  - id: REQ-018
    title: Agents deriving a provenance account shall examine the linked objects' REQUIREMENT SPECIFICATIONs, IMPLEMENTATIONs, and SEMANTIC DECOMPOSITIONs and draw their own conclusions about lineage rather than treating predecessor explanations as authoritative evidence.
    satisfies: [UN-001, UN-003]

  - id: REQ-019
    title: Every bit of stored data belonging to a database object shall be covered by its CONTENT ADDRESS, directly or through content-addressed references; no object metadata, including display-only or non-authoritative data, shall exist outside that coverage, and changing any such data shall produce a distinct object with a new CONTENT ADDRESS.
    satisfies: [UN-001, UN-002]

  - id: REQ-020
    title: The database shall have exactly one first-class object type, a REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT pairing a REQUIREMENT SPECIFICATION with an IMPLEMENTATION; specifications, concrete design files, verification reports and evidence, semantic decompositions, and provenance metadata shall be constituent data of these artifacts rather than independently addressable first-class database objects.
    satisfies: [UN-001, UN-002, UN-003]

  - id: REQ-021
    title: The system shall include an agent's inference only as constituent data of a new REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT and only when that inference contributes to the artifact's traceability; inference that does not contribute to traceability shall be omitted, and the system shall not create standalone inference, reasoning, or provenance-account objects.
    satisfies: [UN-001]

  - id: REQ-022
    title: The database shall permit multiple REQUIREMENTS-TO-IMPLEMENTATION ARTIFACTs containing the same REQUIREMENT SPECIFICATION and different IMPLEMENTATIONs; each alternative shall retain its own VERIFICATION REPORT, CONTENT ADDRESS, and provenance history.
    satisfies: [UN-001, UN-003]

  - id: REQ-023
    title: The database shall represent the same concrete design against different REQUIREMENT SPECIFICATIONs as separate REQUIREMENTS-TO-IMPLEMENTATION ARTIFACTs; each artifact's IMPLEMENTATION shall provide verification artifacts tracing that design to the particular specification in that artifact.
    satisfies: [UN-001]

  - id: REQ-024
    title: When constructing a new REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT, the system shall permit direct reuse of verification evidence cached in an existing artifact when that evidence applies to the concrete design and covers the new specification's full traceability requirements; the new artifact shall contain the reused evidence and its trace to the new specification, and shall determine its own verification status rather than inherit the source artifact's status.
    satisfies: [UN-001, UN-002]

  - id: REQ-025
    title: A REQUIREMENT SPECIFICATION may define required verification evidence and rigor levels; the system shall permit specifications that omit those demands and shall enforce them when explicitly specified.
    satisfies: [UN-001]

  - id: REQ-026
    title: The VERIFICATION REPORT shall record the verification methods and rigor actually supported by its evidence, traceable to the requirements and concrete design verified, whether or not the REQUIREMENT SPECIFICATION demands a particular rigor level; absent evidence shall not establish an achieved rigor level.
    satisfies: [UN-001, UN-003]

  - id: REQ-027
    title: The system shall support querying artifacts by achieved verification rigor in combination with semantic requirement search, including finding smart faucet designs supported by evidence of physical construction and testing while excluding designs supported only by simulation; results shall expose which requirements and design elements the qualifying evidence covers.
    satisfies: [UN-001, UN-003]

  - id: REQ-028
    title: When a REQUIREMENT SPECIFICATION demands no particular verification rigor, passing simulation evidence may establish full verification if it covers every requirement for the concrete design and all other full-verification conditions are met; this classification shall not imply physical construction or testing, which shall remain a separate evidence-based query dimension.
    satisfies: [UN-001, UN-003]

  - id: REQ-029
    title: Each CACHE shall support an explicitly configured ordered list of remote CACHE internet addresses and port numbers; when an artifact is absent locally, the CACHE shall attempt retrieval from those remote CACHEs in the configured order until a valid matching artifact is obtained or the list is exhausted.
    satisfies: [UN-002]

  - id: REQ-030
    title: A CACHE shall validate retrieved artifact content against the requested SHA-256 CONTENT ADDRESS before accepting it for local storage or use; content whose computed address does not match shall be rejected and shall not satisfy the retrieval request.
    satisfies: [UN-001, UN-002]

  - id: REQ-031
    title: A SEMANTIC DECOMPOSITION shall describe capabilities and constraints extractable from the REQUIREMENT SPECIFICATION and the IMPLEMENTATION, including capabilities and constraints inferred by examining the concrete design rather than only its specification's terminology; the system shall support querying these descriptions to discover equivalent capabilities and distinguish relevant constraints.
    satisfies: [UN-001, UN-003]

  - id: REQ-032
    title: The system shall permit revision of an artifact's SEMANTIC DECOMPOSITION as model capability or understanding of capabilities and constraints improves; each revision shall create a new REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT containing the updated decomposition and a predecessor reference to the previous artifact's CONTENT ADDRESS, and shall compute a new CONTENT ADDRESS covering the updated data and predecessor reference without modifying the previous artifact.
    satisfies: [UN-001, UN-002, UN-003]

  - id: REQ-033
    title: Each capability and constraint in an artifact's SEMANTIC DECOMPOSITION shall expose a machine-readable verification status distinguishing evidence-supported verification from inference without sufficient evidence; a verified capability or constraint shall trace to passing, applicable evidence in the VERIFICATION REPORT that covers the claim and its stated conditions, and shall expose the verification method and achieved rigor.
    satisfies: [UN-001, UN-003]

  - id: REQ-034
    title: Browsing and semantic search results shall expose verification statuses and evidence references for individual capabilities and constraints in their summaries so agents can identify verified claims without inspecting the entire artifact; the system shall support filtering by verified capabilities and constraints and shall not infer verification of every semantic capability or constraint from an artifact's overall fully verified status.
    satisfies: [UN-001, UN-003]

  - id: REQ-035
    title: The system shall support semantic search of the local CACHE and configured remote CACHEs, with a selectable search scope and results identifying the originating CACHE and artifact CONTENT ADDRESS.
    satisfies: [UN-002, UN-003]

  - id: REQ-036
    title: The system shall support separately controlled access to an artifact's published REQUIREMENT SPECIFICATION and semantic discovery data, requested verification evidence or proofs, and concrete IMPLEMENTATION; public discovery shall not grant access to restricted evidence or implementation content, including through direct content-address retrieval or remote CACHE substitution.
    satisfies: [UN-001, UN-002, UN-003]

  - id: REQ-037
    title: The system shall permit publishers to make specifications queryable, present verification evidence or proofs upon request under the applicable access restrictions, and sell access to the concrete implementation, granting implementation access only to an authorized requester.
    satisfies: [UN-001, UN-002, UN-003]

  - id: REQ-038
    title: Requested verification evidence or proofs shall identify the exact artifact CONTENT ADDRESS, specification, verified claims, and achieved rigor they concern; checking a claim shall not require disclosure of implementation content for which the requester lacks authorization, and undisclosed or unchecked evidence shall not be presented as independently checked by that requester.
    satisfies: [UN-001, UN-002]

  - id: REQ-039
    title: The system shall permit an authorized recipient of a concrete implementation to independently rerun its validation checks and contribute the resulting report and evidence by producing a new REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT linked to the original artifact as a predecessor; the new evidence shall identify the exact specification and design checked, the checks and conditions, results, and verifying party, without modifying the original artifact.
    satisfies: [UN-001, UN-002]

  - id: REQ-040
    title: Verification evidence shall distinguish publisher-supplied results from recipient or third-party re-verification and expose the provenance and scope of each report; the system shall not treat a valid content hash, cryptographic proof, or claimed independent report alone as establishing the truth of physical measurements or the independence of the reporting party.
    satisfies: [UN-001, UN-003]

  - id: REQ-041
    title: The system shall provide a submission and retrieval hook for recipient or third-party re-verification artifacts, including failed results, and shall expose conflicting reports linked to the original artifact, subject to access restrictions; reports shall remain constituent data of REQUIREMENTS-TO-IMPLEMENTATION ARTIFACTs rather than standalone database objects.
    satisfies: [UN-001, UN-002, UN-003]

  - id: REQ-042
    title: A re-verification report shall record the reproduction procedure, test environment and conditions, and known deviations from the original design or validation procedure, distinguishing unknown reproduction details from confirmed agreement; the system shall not assume a reproduction is faithful or treat a conflicting result alone as conclusively establishing which report is correct.
    satisfies: [UN-001]

  - id: REQ-043
    title: The system shall initially support Bazel and Nix integration for expanding content-addressed implementation dependencies into the relationships required by those systems; other build systems are outside the initial integration scope.
    satisfies: [UN-001, UN-002]

  - id: REQ-044
    title: Artifact dependency relationships shall identify referenced artifacts by CONTENT ADDRESS independently of build-system-specific integration data, so support for additional build systems can be added without replacing the artifact dependency model; integration data stored in an artifact shall remain covered by its CONTENT ADDRESS.
    satisfies: [UN-001, UN-002]

  - id: REQ-045
    title: Each REQUIREMENTS-TO-IMPLEMENTATION ARTIFACT shall include a well-written standard operating procedure containing the information necessary for an authorized recipient to reproduce its verification, including applicable build instructions, tools and dependencies, equipment and setup, test inputs and conditions, ordered steps or automated commands, acceptance criteria, evidence capture, and traceability to the specification; physical procedures shall be documented where automated commands are insufficient, and any missing procedural information shall be explicit verification work remaining rather than compatible with full verification.
    satisfies: [UN-001, UN-002]

  - id: REQ-046
    title: Verification procedures may rely on ordinary domain knowledge and precisely identified established procedures rather than restating general background; any referenced procedure necessary to reproduce verification shall identify the applicable revision and be available to the authorized recipient, with artifact-specific instructions and reference identifiers covered by the artifact's CONTENT ADDRESS.
    satisfies: [UN-001, UN-002]
