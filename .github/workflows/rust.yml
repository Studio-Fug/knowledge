name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --check
      - name: Check pinned GitHub realization
        run: cargo test --locked --test backing -- --ignored --nocapture
      - name: Test
        run: cargo test --locked --all-targets
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
  image:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build image
        run: docker build --tag knowledge:test --label org.opencontainers.image.revision=${{ github.sha }} .
      - name: Test image and routing configuration
        run: cargo test --locked --test container -- --ignored --test-threads=1
      - name: Publish tested architecture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/studio-fug/knowledge
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag knowledge:test "$IMAGE:${{ github.sha }}-$ARCH"
          docker tag knowledge:test "$IMAGE:latest-$ARCH"
          docker push "$IMAGE:${{ github.sha }}-$ARCH"
          docker push "$IMAGE:latest-$ARCH"
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Publish multi-architecture manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/studio-fug/knowledge
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker manifest create "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          docker manifest push "$IMAGE:${{ github.sha }}"
          docker manifest create "$IMAGE:latest" "$IMAGE:${{ github.sha }}-amd64" "$IMAGE:${{ github.sha }}-arm64"
          docker manifest push "$IMAGE:latest"
