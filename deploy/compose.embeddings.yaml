services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.1}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - embedding-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped
  embedding-model:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.1}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: [pull, "${KNOWLEDGE_EMBEDDING_MODEL:-embeddinggemma}"]
    depends_on:
      ollama:
        condition: service_healthy
  knowledge:
    environment:
      KNOWLEDGE_EMBEDDING_ENDPOINT: http://ollama:11434
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      embedding-model:
        condition: service_completed_successfully
    healthcheck:
      start_period: 10m

volumes:
  embedding-models:
