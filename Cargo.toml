[package]
name = "knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Content-addressed designs with traceable verification"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
fs2 = "0.4"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[lints.rust]
unsafe_code = "forbid"
